name: Build Release AAB

on:
  push:
    branches:
      - main

jobs:
  build-release:
    name: Build AAB for Play Store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Create google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > android/app/google-services.json

      - name: Create firebase_options.dart
        run: echo "${{ secrets.FIREBASE_OPTIONS }}" > lib/firebase_options.dart

      - name: Build AAB
        run: >
          flutter build appbundle --release 
          --build-number=${{ github.run_number }}
          --dart-define=BASE_URL=${{ secrets.BASE_URL }}
          --dart-define=QR_ENCRYPTION_KEY=${{ secrets.QR_ENCRYPTION_KEY }}
          --dart-define=QR_ENCRYPTION_IV=${{ secrets.QR_ENCRYPTION_IV }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v3
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
