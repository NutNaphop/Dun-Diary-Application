name: Build Release AAB

on:
  push:
    branches:
      - main

jobs:
  build-release:
    name: Build AAB for Play Store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Flutter Pub and Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-pub-gradle-${{ hashFiles('**/pubspec.yaml', '**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-pub-gradle-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Create google-services.json
        run: |
          cat << EOF > android/app/google-services.json
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      - name: Create firebase_options.dart
        run: |
          cat << EOF > lib/firebase_options.dart
          ${{ secrets.FIREBASE_OPTIONS }}
          EOF

      - name: Create Built-in Environment variables
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          QR_ENCRYPTION_KEY: ${{ secrets.QR_ENCRYPTION_KEY }}
          QR_ENCRYPTION_IV: ${{ secrets.QR_ENCRYPTION_IV }}
        run: |
          jq -n \
            --arg BASE_URL "$BASE_URL" \
            --arg QR_ENCRYPTION_KEY "$QR_ENCRYPTION_KEY" \
            --arg QR_ENCRYPTION_IV "$QR_ENCRYPTION_IV" \
            '{BASE_URL: $BASE_URL, QR_ENCRYPTION_KEY: $QR_ENCRYPTION_KEY, QR_ENCRYPTION_IV: $QR_ENCRYPTION_IV}' > env.product.json

      - name: Build AAB
        run: flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define-from-file=env.product.json

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v3
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
